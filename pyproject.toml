[project]
name = "mtlm"
version = "1.4.1"
description = "MT4 MT5 Library Manager PRO — gestion et analyse sécurisée de bibliothèques MetaTrader (macOS)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Propriétaire — tous droits réservés" }
dependencies = [
    # Qt 6.10+ exige macOS 13, Qt 6.12 macOS 14 : 6.9 est la dernière branche compatible
    # macOS 12 Monterey (dernier système des Mac Intel 2015-2016). Vérifié en CI (minos).
    "pyside6-essentials>=6.9.3,<6.10",
]

[project.scripts]
mtlm = "mtlm.cli.main:main"

[project.gui-scripts]
mtlm-gui = "mtlm.ui.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
    "slow: tests longs (corpus 50k/100k) — lancés explicitement avec -m slow",
]

[tool.coverage.run]
source = ["mtlm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/mtlm", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textes en français (apostrophes, guillemets typographiques)
    # S608 : les seules parties dynamiques des requêtes SQL sont des fragments fixes du code
    # (clauses, nombre de marqueurs « ? ») ; toutes les valeurs passent par des paramètres liés.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "PTH"]
# Module fs : chemins manipulés en octets (noms mal encodés conservés) => API os.* volontaire.
"src/mtlm/fs/**" = ["PTH"]
"src/mtlm/transfer/**" = ["PTH"]
"tools/**" = ["S603"]
"src/mtlm/ui/**" = ["N802"]  # surcharges de l'API Qt (sizeHint, closeEvent…)  # outils de développement : lancent le Python du projet
