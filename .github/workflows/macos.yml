# CI macOS : vrais Mac Apple Silicon et Intel (compatibilité testée, non supposée — F13).
# Les minutes Mac coûtent 10 fois plus (dépôt privé) : depuis 1.3.0, ces tests tournent
# seulement pour une publication (« [publier] » ou étiquette v*) ou à la demande ; la CI Linux,
# elle, tourne à chaque envoi (RISQUES R-12).
name: CI macOS

on:
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publier]')
    env:
      QT_QPA_PLATFORM: offscreen
    name: Tests macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Étiquettes à confirmer au premier lancement (catalogue GitHub susceptible d'évoluer).
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Environnement
        run: |
          sw_vers
          uname -m
          uv run python -c "import sqlite3, sys; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - run: uv sync --frozen
      - name: Tests + couverture
        run: >
          uv run pytest -W error::ResourceWarning
          --cov --cov-report=term --cov-fail-under=85
          --junitxml=pytest-report.xml
      - name: Invariant « sources inchangées » à 50 000 fichiers
        run: uv run pytest -m slow -s -k "50000" --junitxml=pytest-charge.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapports-${{ matrix.runner }}
          path: pytest-*.xml
