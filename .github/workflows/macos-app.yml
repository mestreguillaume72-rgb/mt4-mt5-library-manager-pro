# Livraison macOS (F13) : construit l'application .app et l'image DMG sur de vrais Mac
# (Apple Silicon et Intel), les vérifie (signature, auto-diagnostic, DMG monté) et les met à
# disposition. Sur une étiquette v*, une pré-version GitHub est publiée avec les DMG.
name: Application macOS (.app + DMG)

on:
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construction (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      APP: "dist/MT4 MT5 Library Manager PRO.app"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple-Silicon
          - runner: macos-15-intel
            label: Intel
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Environnement
        run: |
          sw_vers
          uname -m
      - name: Dépendances (verrou uv.lock)
        run: uv sync --frozen --group build
      - name: Icône de l'application (.icns)
        run: |
          uv run python tools/icone.py packaging/macos/AppIcon.iconset
          iconutil -c icns packaging/macos/AppIcon.iconset -o packaging/macos/AppIcon.icns
          ls -la packaging/macos/AppIcon.icns
      - name: Construire l'application
        run: uv run --group build pyinstaller --noconfirm packaging/macos/mtlm.spec
      - name: Vérifier l'application
        shell: bash
        run: |
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/mtlm-gui" | tee architectures.txt
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee signature.txt
          plutil -p "$APP/Contents/Info.plist" | tee info-plist.txt
          du -sh "$APP" | tee taille.txt
      - name: Version minimale de macOS réellement exigée (tous les binaires)
        shell: bash
        run: tools/verifier_minos.sh "$APP" | tee minos.txt
      - name: Auto-diagnostic (lecture seule du contenu de l'application)
        shell: bash
        run: |
          find "$APP" -type f -exec shasum -a 256 {} + | sort > avant.txt
          "$APP/Contents/MacOS/mtlm-gui" --autotest "$APP/Contents" | tee autotest.log
          find "$APP" -type f -exec shasum -a 256 {} + | sort > apres.txt
          diff avant.txt apres.txt && echo "Contenu de l'application inchangé après analyse."
          codesign --verify --deep --strict "$APP"
      - name: Créer et vérifier le DMG
        shell: bash
        run: |
          VERSION=$(uv run python -c "import mtlm; print(mtlm.__version__)")
          DMG="MT4-MT5-Library-Manager-PRO-${VERSION}-macOS-${{ matrix.label }}.dmg"
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MT4 MT5 Library Manager PRO" -srcfolder dmg-root -ov \
            -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Tester l'application depuis le DMG monté
        shell: bash
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | awk -F'\t' '{print $NF}')
          echo "Monté sur : $MNT"
          ls -la "$MNT"
          "$MNT/MT4 MT5 Library Manager PRO.app/Contents/MacOS/mtlm-gui" --autotest \
            "$MNT/MT4 MT5 Library Manager PRO.app/Contents" | tee autotest-dmg.log
          hdiutil detach "$MNT"
      - name: Tester l'installateur (Installer.command)
        shell: bash
        env:
          MTLM_NO_LAUNCH: "1"
          MTLM_NO_PAUSE: "1"
        run: |
          KIT="$RUNNER_TEMP/kit"
          FILES="$KIT/Fichiers d'installation"
          mkdir -p "$FILES"
          cp packaging/macos/installation/Installer.command "$KIT/"
          cp "$DMG" "$DMG.sha256" "$FILES/"
          export MTLM_INSTALL_DIR="$RUNNER_TEMP/Applications"
          mkdir -p "$MTLM_INSTALL_DIR"
          INSTALLED="$MTLM_INSTALL_DIR/MT4 MT5 Library Manager PRO.app"
          # 1) première installation (fichier téléchargé : attribut de quarantaine présent)
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$FILES/$DMG"
          "$KIT/Installer.command" | tee installateur.log
          test -d "$INSTALLED"
          if xattr "$INSTALLED" | grep -q com.apple.quarantine; then exit 1; fi
          "$INSTALLED/Contents/MacOS/mtlm-gui" --autotest "$INSTALLED/Contents" | tee -a installateur.log
          # 2) mise à jour : l'ancienne version de l'application est remplacée
          "$KIT/Installer.command" | tee -a installateur.log
          grep -q "Ancienne version remplacée" installateur.log
          codesign --verify --deep --strict "$INSTALLED"
          # 3) un élément étranger du même nom n'est jamais touché
          rm -rf "$INSTALLED" && mkdir -p "$INSTALLED/Contents" && echo garder > "$INSTALLED/garder.txt"
          if "$KIT/Installer.command" >> installateur.log; then exit 1; fi
          test "$(cat "$INSTALLED/garder.txt")" = garder
          rm -rf "$INSTALLED"
          # 4) fichier d'installation abîmé : refus, rien d'installé
          printf 'x' >> "$FILES/$DMG"
          if "$KIT/Installer.command" >> installateur.log; then exit 1; fi
          grep -q "abîmé" installateur.log
          test ! -e "$INSTALLED"
          # 5) Mac trop ancien : refus clair avant toute copie
          cp "$DMG" "$FILES/"  # image intacte (abîmée exprès au scénario 4)
          if MTLM_FAKE_OS_VERSION=11.7 "$KIT/Installer.command" >> installateur.log; then exit 1; fi
          grep -q "demande macOS 12.0 ou plus récent" installateur.log
          test ! -e "$INSTALLED"
          echo "Installateur : 5 scénarios vérifiés."
      - name: Gatekeeper (information — application non notarisée)
        shell: bash
        run: spctl --assess --type execute -vv "$APP" 2>&1 | tee gatekeeper.txt || true
      - uses: actions/upload-artifact@v5
        with:
          name: DMG-${{ matrix.label }}
          path: |
            *.dmg
            *.dmg.sha256
          retention-days: 90
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapports-application-${{ matrix.label }}
          path: |
            architectures.txt
            signature.txt
            info-plist.txt
            taille.txt
            autotest.log
            autotest-dmg.log
            gatekeeper.txt
            installateur.log
            minos.txt

  release:
    name: Pré-version GitHub
    needs: build
    # Publication : étiquette v*, ou envoi dont le message contient « [publier] ».
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publier]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: DMG-*
          merge-multiple: true
          path: dmg
      - name: Dossier d'installation (installateur + guide + DMG)
        run: |
          VERSION=$(grep -m1 '__version__' src/mtlm/__init__.py | cut -d'"' -f2)
          NAME="MT4 MT5 Library Manager PRO - Installation"
          mkdir -p "kit/$NAME/Fichiers d'installation"
          cp packaging/macos/installation/Installer.command "kit/$NAME/"
          chmod 755 "kit/$NAME/Installer.command"
          cp "packaging/macos/installation/Guide d'installation.pdf" "kit/$NAME/"
          cp dmg/*.dmg dmg/*.dmg.sha256 "kit/$NAME/Fichiers d'installation/"
          ZIP="MT4-MT5-Library-Manager-PRO-${VERSION}-Installation-macOS.zip"
          (cd kit && zip -r -X "../dmg/$ZIP" "$NAME")
          (cd dmg && sha256sum "$ZIP" > "$ZIP.sha256")
          unzip -l "dmg/$ZIP"
      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '__version__' src/mtlm/__init__.py | cut -d'"' -f2)
          TAG="v${VERSION}"
          NOTES="Application macOS (Apple Silicon et Intel), construite et testée sur Mac (auto-diagnostic depuis le DMG monté). Le plus simple : téléchargez le fichier « Installation-macOS.zip », ouvrez-le puis double-cliquez sur « Installer.command » (voir le « Guide d'installation.pdf » inclus). Application non notarisée. Voir docs/utilisateur/installation.md et docs/rapports/phase-12.md."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dmg/*.dmg dmg/*.dmg.sha256 dmg/*.zip dmg/*.zip.sha256
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "MT4 MT5 Library Manager PRO $TAG" --notes "$NOTES" \
              dmg/*.dmg dmg/*.dmg.sha256 dmg/*.zip dmg/*.zip.sha256
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
